                            type: array
                          required:
                            example: true
                            type: boolean
                        required:
                        - name
                        - required
                        title: Task.Parameter
                        type: object
                      type: array
                    paused:
                      example: false
                      type: boolean
                    pipeline_file:
                      example: pipeline.yml
