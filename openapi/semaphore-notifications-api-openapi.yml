                                nullable: true
                                properties:
                                  method:
                                    default: POST
                                    description: Webhook http verb
                                    type: string
                                  retries:
                                    default: 3
                                    description: Number of times to retry delivery.
                                    maximum: 3
                                    minimum: 1
                                    type: integer
                                  secret:
