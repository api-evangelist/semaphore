                                    description: Webhook delivery timeout in ms
                                    type: integer
                                  url:
                                    description: Webhook HTTP endpoint to hit.
                                    type: string
                                required:
                                - url
                                type: object
                            type: object
                        title: Notifications.Notification.Rule
                        type: object
                      maxLength: 20
                      minLength: 1
                      type: array
                  required:
                  - name
                  type: object
              required:
              - apiVersion
              - kind
              - metadata
              - spec
              title: Notifications.Notification
              type: object
