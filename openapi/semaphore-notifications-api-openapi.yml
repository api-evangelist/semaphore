                              description:
                                description: Description of the failure
                                type: string
                              timestamp:
                                description: Timestamp in ISO 8601 format
                                format: date-time
                                title: Timestamp
                                type: string
                            type: object
                          type: array
                      title: Notifications.Notification.Status
                      type: object
                    updated_at:
                      description: Timestamp in ISO 8601 format
                      format: date-time
                      nullable: true
                      title: Timestamp
                      type: string
                  readOnly: true
                  required:
                  - id
                  - name
                  type: object
