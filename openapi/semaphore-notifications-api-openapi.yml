  /notifications/{id_or_name}:
    delete:
      operationId: Notifications.Delete
      description: Delete a notification.
      tags:
      - Notifications
      parameters:
      - description: Id or name of the notification
        in: path
        name: id_or_name
        required: true
        schema:
          anyOf:
          - description: ID of a Notification
            example: 93d63136-65d8-46fa-82b8-ba1f5c19e973
            format: uuid
            title: Notification.ID
            type: string
          - description: Name of the notification
            type: string
      responses:
