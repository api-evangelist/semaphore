          content:
            application/json:
              schema:
                properties:
                  id:
                    description: ID of a Notification
                    example: 8dc3d483-7095-4782-8dc0-4194862ae27c
                    format: uuid
                    title: Notification.ID
                    type: string
                title: Notifications.DeleteResponse
                type: object
          description: Notification
