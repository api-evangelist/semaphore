  /projects/{project_id_or_name}/deployment_targets/{id_or_name}/history:
    get:
      operationId: DeploymentTargets.History
      description: This endpoint provides the deployment history for a specific deployment target.
      tags:
      - DeploymentTargets
      parameters:
      - description: Id or name of the project
        in: path
        name: project_id_or_name
        required: true
        schema:
          anyOf:
          - description: ID of a Project
            example: ccaedf80-b27c-4471-8c6f-3e936f3b457c
            format: uuid
            title: Project.ID
            type: string
          - description: Project name must match the regex
            example: my-project
            minLength: 1
            pattern: \A[\w\-\.]+\z
            title: Project.Name
            type: string
      - description: Id or name of the deployment target
        in: path
        name: id_or_name
        required: true
        schema:
          description: Id or name of the deployment target
          type: string
      - description: Git reference type
        in: query
        name: git_ref_type
        required: false
        schema:
          description: Git reference type
          type: string
      - description: Git reference label
        in: query
        name: git_ref_label
        required: false
        schema:
          description: Git reference label
          type: string
      - description: Triggerer ID or value
        in: query
        name: triggered_by
        required: false
        schema:
          description: Triggerer ID or value
          type: string
      - description: 'Value of promotion parameter with the name from bookmark slot #1'
        in: query
        name: parameter1
        required: false
        schema:
          description: 'Value of promotion parameter with the name from bookmark slot #1'
          type: string
      - description: 'Value of promotion parameter with the name from bookmark slot #2'
        in: query
        name: parameter2
        required: false
        schema:
          description: 'Value of promotion parameter with the name from bookmark slot #2'
          type: string
      - description: 'Value of promotion parameter with the name from bookmark slot #3'
        in: query
        name: parameter3
        required: false
        schema:
          description: 'Value of promotion parameter with the name from bookmark slot #3'
          type: string
      - description: Direction of the list from the provided token
        in: query
        name: direction
        required: false
        schema:
          default: NEXT
          description: "Use NEXT the token to get next page of results,\n              use PREVIOUS to get the deployments before the token."
          enum:
          - NEXT
          - PREVIOUS
          type: string
      - description: Starting point for listing, if you are fetching first page leave it empty
        in: query
        name: page_token
        required: false
        schema:
          default: ''
          type: string
      - description: Page size
        in: query
        name: page_size
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: PageSize
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  description: A deployment history item contains relevant details about deployments triggered for a deployment target.
                  nullable: true
                  properties:
                    env_vars:
                      description: Environment variables of the deployment target
                      items:
                        description: EnvVar
                        properties:
                          name:
                            description: Name of the environment variable
                            example: MY_SECRET
                            minLength: 1
                            type: string
                          value:
                            description: Value of the environment variable
                            example: secret
                            minLength: 1
                            type: string
                        required:
                        - name
                        - value
                        title: Secrets.Secret.EnvVar
                        type: object
                      type: array
                    id:
                      description: ID of a Deployment
                      example: a0424427-ff28-4f77-a893-0fdf5f50c380
                      format: uuid
                      title: Deployment.ID
                      type: string
                    origin_pipeline_id:
                      description: ID of a Pipeline
                      example: 97ba55d1-90d7-40b9-a2dd-bdbd02389b58
                      format: uuid
                      nullable: true
                      title: Pipeline.ID
                      type: string
                    pipeline_id:
                      description: ID of a Pipeline
                      example: adc5a26f-4077-47bc-8d4f-cb4467f2c103
                      format: uuid
                      nullable: true
                      title: Pipeline.ID
                      type: string
                    state:
                      description: The state of the last deployment of the deployment target
                      enum:
                      - PENDING
                      - STARTED
                      - FAILED
                      type: string
                    state_message:
                      description: The message of the last deployment of the deployment target
                      type: string
                    target_id:
                      description: ID of a DeploymentTarget
                      example: 4a9e9001-6703-4815-9c19-ed2e9e8c87ea
                      format: uuid
                      title: DeploymentTarget.ID
                      type: string
                    target_name:
                      description: The name of the deployment target
                      type: string
                    triggered_at:
                      description: Timestamp in ISO 8601 format
                      format: date-time
                      title: Timestamp
                      type: string
                    triggered_by:
                      properties:
                        id:
                          description: ID of a User
                          example: 18b40eaf-ce10-49c3-93f2-e4fe72d5160b
                          format: uuid
                          title: User.ID
                          type: string
                      title: User
                      type: object
                  title: DeploymentTargets.HistoryItem
                  type: object
                title: DeploymentTargets.HistoryResponse
                type: array
          description: History of deployment target
        '400':
          content:
            application/json:
              schema:
