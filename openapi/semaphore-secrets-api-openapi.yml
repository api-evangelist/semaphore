                  readOnly: true
                  title: Kind
                  type: string
                metadata:
                  description: Metadata of the secret, all fields are read only
                  properties:
                    created_at:
                      description: Timestamp in ISO 8601 format
                      format: date-time
                      title: Timestamp
                      type: string
                    created_by:
                      properties:
