                          format: uuid
                          title: Job.ID
                          type: string
                        pipeline_id:
                          description: ID of a Pipeline
                          example: 4cd4fdb9-4248-4348-932c-855746110bcc
                          format: uuid
                          title: Pipeline.ID
                          type: string
                        project_id:
                          description: ID of a Project
                          example: 1c306e24-af58-4e95-8cd9-27e9a1a36428
                          format: uuid
                          title: Project.ID
                          type: string
                        user_id:
                          description: ID of a User
                          example: 7a8f94b1-c5b6-4195-82ca-f68664fa832b
                          format: uuid
                          title: User.ID
                          type: string
                        workflow_id:
                          description: ID of a Workflow
                          example: 40dcd7b2-3e42-4958-8c08-7eb5aa8690f6
                          format: uuid
                          title: Workflow.ID
                          type: string
                      title: Secrets.Checkout
                      type: object
                    name:
                      description: Secret name must match the regex
                      example: my-secret
                      minLength: 1
                      pattern: '^[@: -._a-zA-Z0-9]+$'
                      title: Secret.Name
                      type: string
                    org_id:
                      description: ID of a Organization
                      example: 476f994f-76bc-4ff1-9cdf-5092d29236cf
                      format: uuid
                      title: Organization.ID
                      type: string
                    updated_at:
                      description: Timestamp in ISO 8601 format
                      format: date-time
                      title: Timestamp
                      type: string
                    updated_by:
