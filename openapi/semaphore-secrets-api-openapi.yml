                          example: 18b40eaf-ce10-49c3-93f2-e4fe72d5160b
                          format: uuid
                          title: User.ID
                          type: string
                      title: User
                      type: object
                    description:
                      description: Description of the secret
                      type: string
                    id:
                      description: ID of a Secret
                      example: b6654945-cf11-43a1-8e3a-f5a22c7d19fa
                      format: uuid
                      title: Secret.ID
                      type: string
                    last_used_at:
