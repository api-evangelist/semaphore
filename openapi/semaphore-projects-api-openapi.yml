  /projects/{project_id_or_name}:
    delete:
      operationId: Projects.Delete
      description: Delete a project.
      tags:
      - Projects
      parameters:
      - description: Id or name of the project
        in: path
        name: project_id_or_name
        required: true
        schema:
          anyOf:
          - description: ID of a Project
            example: 7addf73c-f7e8-43a4-bc44-b2414f956c7f
            format: uuid
            title: Project.ID
            type: string
          - description: Project name must match the regex
            example: my-project
            minLength: 1
            pattern: \A[\w\-\.]+\z
            title: Project.Name
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                description: ''
                properties:
