                              - GITHUB_OAUTH_TOKEN
                              - BITBUCKET
                              type: string
                            pipeline_file:
                              default: .semaphore/semaphore.yml
                              description: Path to the pipeline file to run the projec pipelines with
                              type: string
                            run_on:
