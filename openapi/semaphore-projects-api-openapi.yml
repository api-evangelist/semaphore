                            title: User.ID
                            type: string
                        title: User
                        type: object
                      description:
                        description: Description of the project
                        type: string
                      id:
                        description: ID of a Project
                        example: ed12ab59-9224-45c8-82d6-79bf158aaae6
                        format: uuid
                        title: Project.ID
                        type: string
                      name:
                        description: Secret name must match the regex
                        example: my-secret
                        minLength: 1
