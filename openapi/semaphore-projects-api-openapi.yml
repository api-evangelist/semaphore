                                type: array
                              tags:
                                description: List of tags that can be build. Regular expressions allowed. Empty list means that all tags can. Used only when RunType TAGS is included.
                                items:
                                  type: string
                                type: array
                            type: object
                        required:
                        - url
                        - integration_type
                        - run_on
                        type: object
                      visibility:
                        description: Visibility of the project
                        enum:
                        - PUBLIC
                        - PRIVATE
                        type: string
                    required:
                    - repository
                    - name
                    type: object
                required:
                - apiVersion
                - kind
                - metadata
                - spec
                title: Projects.Project
                type: object
          description: Created project
        '400':
          content:
            application/json:
              schema:
                properties:
                  documentation_url:
                    example: https://docs.semaphoreci.com/api/error-codes/bad-request
                    format: uri
                    type: string
                  message:
                    type: string
                title: Error
                type: object
